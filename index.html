<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>교육과정 캘린더 대시보드</title>
<!-- 프리텐다드 폰트 적용 -->
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root {
    /* 전체 배경(블랙/다크) 및 캘린더(화이트) 테마 변수 */
    --bg-dark: #1E1E1E;
    --text-light: #F5F5F5;
    --cal-bg: #FFFFFF;
    --cal-text: #333333;
    --cal-line: #E0E0E0;
    --cal-header: #F7F8FA;
    --accent: #2E7D32;
    --font: 'Pretendard', sans-serif;
  }
  
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px; 
    background: var(--bg-dark); color: var(--text-light);
    font-family: var(--font); line-height: 1.4;
  }
  
  /* 해상도 100% 최적화를 위한 폭/여백 조정 */
  .dash { max-width: 1080px; margin: 0 auto; }

  /* 헤더 영역 */
  .top {
    display: flex; align-items: flex-end; justify-content: space-between;
    flex-wrap: wrap; gap: 16px; margin-bottom: 24px;
  }
  /* 메인 타이틀 크기 확대 */
  .top h1 { font-size: 28px; font-weight: 800; margin: 0 0 6px; letter-spacing: -0.5px; }
  .top .sub { font-size: 14px; color: #BBBBBB; font-weight: 300; }
  
  .nav { display: flex; align-items: center; gap: 12px; }
  .nav button {
    border: 1px solid #444; background: #2A2A2A; color: #FFF;
    border-radius: 6px; width: 36px; height: 36px; cursor: pointer; font-size: 16px;
    transition: background 0.2s;
  }
  .nav button:hover { background: #444; }
  .nav .month-label { font-size: 18px; font-weight: 700; min-width: 110px; text-align: center; }
  .nav .today-btn { width: auto; padding: 0 16px; font-size: 14px; font-weight: 600; }

  /* 상태 표시 */
  .status-bar { margin-bottom: 12px; font-size: 13px; color: #4CAF50; font-weight: 500; display: flex; justify-content: space-between; }
  .status-bar button.sync-btn {
    background: transparent; border: 1px solid #555; color: #CCC;
    padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px;
  }

  /* 캘린더 본체 (화이트 테마 적용) */
  .cal { 
    background: var(--cal-bg); border: 1px solid var(--cal-line); 
    border-radius: 12px; overflow: hidden; color: var(--cal-text);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  
  .weekday-row { display: grid; background: var(--cal-header); border-bottom: 1px solid var(--cal-line); }
  .weekday-row div {
    text-align: center; font-size: 13px; font-weight: 600; padding: 12px 0; color: #555;
  }
  .weekday-row div.sun { color: #E53935; }
  .weekday-row div.sat { color: #1E88E5; }

  /* 겹치는 일정을 위한 유연한 높이 설정 */
  .week-row { 
    display: grid; column-gap: 1px; row-gap: 3px; padding: 6px 0 12px; 
    border-top: 1px solid var(--cal-line); min-height: 110px; align-content: start;
  }
  .week-row:first-child { border-top: none; }
  
  /* 날짜 폰트 얇게 (font-weight: 300) */
  .date-cell { 
    grid-row: 1; text-align: right; padding: 4px 8px 4px 0; 
    font-size: 14px; font-weight: 300; color: #333; cursor: pointer; 
    transition: background 0.2s;
  }
  .date-cell:hover { background: #F5F5F5; }
  .date-cell.other-month { color: #B0B0B0; }
  .date-cell.today .num {
    display: inline-block; background: var(--accent); color: #fff; border-radius: 50%;
    width: 24px; height: 24px; line-height: 24px; text-align: center; font-weight: 600;
  }

  /* 일정 바 가독성 개선 */
  .event-bar {
    grid-row: span 1; margin: 1px 4px; padding: 3px 6px; border-radius: 4px;
    font-size: 11.5px; font-weight: 500; color: #FFF; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; cursor: pointer;
    border: 1px solid rgba(0,0,0,0.1); box-shadow: 0 1px 2px rgba(0,0,0,0.1);
  }
  .event-bar:hover { filter: brightness(0.9); transform: scale(1.01); z-index: 10; position: relative; }

  /* 정보 및 입력 팝업 모달 */
  .modal-overlay {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.7); align-items: center; justify-content: center; z-index: 999;
  }
  .modal {
    background: #222; padding: 28px; border-radius: 12px; width: 380px;
    border: 1px solid #444; box-shadow: 0 10px 30px rgba(0,0,0,0.8); color: #FFF;
  }
  .modal h2 { margin: 0 0 20px 0; font-size: 18px; font-weight: 700; border-bottom: 1px solid #444; padding-bottom: 12px;}
  
  .info-group { margin-bottom: 16px; font-size: 14px; line-height: 1.6; }
  .info-group .label { font-size: 12px; color: #999; margin-bottom: 2px; }
  .info-group .value { font-weight: 500; }

  .modal label { display: block; font-size: 12px; color: #999; margin-bottom: 6px; }
  .modal input {
    width: 100%; margin-bottom: 16px; padding: 10px; border-radius: 6px;
    border: 1px solid #555; background: #111; color: #FFF; font-family: var(--font);
  }
  .modal .btn-group { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  .modal button {
    border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer;
    font-size: 13px; font-weight: 600; font-family: var(--font);
  }
  .btn-cancel { background: transparent; color: #CCC; border: 1px solid #555 !important; }
  .btn-submit { background: var(--accent); color: #FFF; }

</style>
</head>
<body>
<div class="dash">
  <div class="top">
    <div>
      <h1>연수 운영 캘린더</h1>
      <div class="sub">구글 시트 연동 | 일정을 클릭하여 출장 정보 및 상세 내용을 확인하세요.</div>
    </div>
    <div class="nav">
      <button id="prevBtn" title="이전 달">‹</button>
      <div class="month-label" id="monthLabel"></div>
      <button id="nextBtn" title="다음 달">›</button>
      <button class="today-btn" id="todayBtn">오늘</button>
    </div>
  </div>

  <div class="status-bar">
    <span id="statusMsg">데이터 연동 중...</span>
    <button class="sync-btn" onclick="fetchData()">🔄 데이터 새로고침</button>
  </div>

  <div class="cal">
    <div class="weekday-row" id="weekdayRow"></div>
    <div id="calendarBody"></div>
  </div>
</div>

<!-- 상세 정보 및 운영자 수정 모달 -->
<div class="modal-overlay" id="infoModalOverlay">
  <div class="modal">
    <h2>교육 상세 정보</h2>
    
    <div class="info-group">
      <div class="label">과정명</div>
      <div class="value" id="infoTitle"></div>
    </div>
    <div class="info-group">
      <div class="label">일정</div>
      <div class="value" id="infoDates"></div>
    </div>
    
    <label style="margin-top:20px;">출장 운영자 관리</label>
    <input type="text" id="editOperator" placeholder="운영자 이름 입력 (예: 조성현 대리)" />
    <input type="hidden" id="editOriginalStart" />
    <input type="hidden" id="editTitleHidden" />
    
    <div class="btn-group">
      <button class="btn-cancel" onclick="closeModal('infoModalOverlay')">닫기</button>
      <button class="btn-submit" onclick="submitEditEvent()">수정 저장</button>
    </div>
  </div>
</div>

<script>
/* ================= 필수 설정 영역 ================= */
// 배포하신 앱스 스크립트 웹앱 주소를 아래에 넣어야 쓰기(수정) 기능이 작동합니다.
const WEB_APP_URL = ""; 

// 연결할 원본 구글 시트 ID (자동 연동)
const CONFIG = { 
  sheetId: '1SZ2ioWu4E6w5wuBkbhrlMTRtrwSF_y7iLVOALy2wFeU', 
  sheetName: 'Sheet1' 
};

// 가독성을 위한 파스텔/딥 톤 컬러 팔레트 (흰 배경에 어울리도록 최적화)
const PALETTE = ['#5C6BC0','#42A5F5','#66BB6A','#FFA726','#EF5350','#8D6E63','#AB47BC','#26A69A'];

const state = {
  year: new Date().getFullYear(), month: new Date().getMonth(), 
  events: [], categoryColors: new Map(),
};

const els = {
  monthLabel: document.getElementById('monthLabel'),
  weekdayRow: document.getElementById('weekdayRow'),
  calendarBody: document.getElementById('calendarBody'),
  status: document.getElementById('statusMsg')
};

function stripTime(d){ const c = new Date(d); c.setHours(0,0,0,0); return c; }
function isSameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function fmtDateForUI(d) { return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`; }
function fmtDateForInput(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

function getColor(title){
  const key = title.split(' ')[0];
  if(!state.categoryColors.has(key)){ state.categoryColors.set(key, PALETTE[state.categoryColors.size % PALETTE.length]); }
  return state.categoryColors.get(key);
}

/* ================= 구글 시트 실시간 읽기 ================= */
// Google Visualization API를 사용하여 실시간으로 데이터를 불러옵니다.
function parseGvizDate(cell){
  if(!cell) return null;
  const v = cell.v;
  if(typeof v === 'string' && v.startsWith('Date(')){
    const m = v.match(/Date\((\d+),(\d+),(\d+)/);
    if(m) return new Date(+m[1], +m[2], +m[3]);
  }
  const raw = (cell.f || v || '').toString().trim().replace(/\./g,'-').replace(/\//g,'-');
  const d = new Date(raw);
  return isNaN(d) ? null : d;
}

async function fetchData(){
  els.status.textContent = '데이터 실시간 동기화 중...';
  try{
    const url = `https://docs.google.com/spreadsheets/d/${CONFIG.sheetId}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(CONFIG.sheetName)}`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('Network response was not ok');
    const text = await res.text();
    const json = JSON.parse(text.substring(text.indexOf('(')+1, text.lastIndexOf(')')));
    
    const parsed = [];
    (json.table.rows || []).forEach(r=>{
      const c = r.c || [];
      const title = c[0] && (c[0].v || c[0].f);
      if(!title) return;
      const start = parseGvizDate(c[1]);
      if(!start) return;
      const end = c[2] ? (parseGvizDate(c[2]) || start) : start;
      const operator = (c[3] && (c[3].v || c[3].f)) || '';
      parsed.push({ title, operator, start, end: end < start ? start : end });
    });
    
    state.events = parsed;
    els.status.textContent = `🟢 시트 연동 완료 (${parsed.length}건)`;
    render();
  }catch(err){
    els.status.textContent = '🔴 데이터 불러오기 실패. 시트 공유 권한을 확인해주세요.';
  }
}

/* ================= 캘린더 렌더링 ================= */
function renderWeekdayHeader(){
  const labels = ['월','화','수','목','금','토','일'];
  els.weekdayRow.style.gridTemplateColumns = `repeat(7, 1fr)`;
  els.weekdayRow.innerHTML = labels.map((lbl, i)=>{
    const cls = i===5 ? 'sat' : (i===6 ? 'sun' : '');
    return `<div class="${cls}">${lbl}</div>`;
  }).join('');
}

function renderCalendar(){
  const first = new Date(state.year, state.month, 1);
  const last = new Date(state.year, state.month+1, 0);
  const firstDay = (first.getDay() + 6) % 7; 
  const gridStart = new Date(first); gridStart.setDate(first.getDate() - firstDay);
  const lastDay = (last.getDay() + 6) % 7;
  const gridEnd = new Date(last); gridEnd.setDate(last.getDate() + (6 - lastDay));
  
  const weeks = [];
  let cur = new Date(gridStart);
  while(cur <= gridEnd){
    const week = [];
    for(let i=0;i<7;i++){ week.push(new Date(cur)); cur.setDate(cur.getDate()+1); }
    weeks.push(week);
  }

  const today = stripTime(new Date());
  els.calendarBody.innerHTML = '';

  weeks.forEach(week=>{
    const segments = [];
    state.events.forEach(ev=>{
      let startPos=-1, endPos=-1;
      week.forEach((d,pos)=>{
        if(d >= ev.start && d <= ev.end){ if(startPos===-1) startPos=pos; endPos=pos; }
      });
      if(startPos!==-1) segments.push({ ev, startPos, endPos });
    });
    segments.sort((a,b)=> a.startPos - b.startPos || (b.endPos-b.startPos) - (a.endPos-a.startPos));

    const laneEnds = [];
    segments.forEach(seg=>{
      let lane = laneEnds.findIndex(end => end < seg.startPos);
      if(lane === -1){ lane = laneEnds.length; laneEnds.push(seg.endPos); }
      else{ laneEnds[lane] = seg.endPos; }
      seg.lane = lane;
    });

    const row = document.createElement('div');
    row.className = 'week-row';
    row.style.gridTemplateColumns = `repeat(7, 1fr)`;

    week.forEach((d,pos)=>{
      const cell = document.createElement('div');
      const otherMonth = d.getMonth() !== state.month;
      cell.className = 'date-cell' + (otherMonth ? ' other-month' : '') + (isSameDay(d, today) ? ' today' : '');
      cell.style.gridColumn = pos+1;
      cell.innerHTML = isSameDay(d, today) ? `<span class="num">${d.getDate()}</span>` : d.getDate();
      row.appendChild(cell);
    });

    segments.forEach(seg=>{
      const bar = document.createElement('div');
      bar.className = 'event-bar';
      bar.style.gridColumn = `${seg.startPos+1} / span ${seg.endPos-seg.startPos+1}`;
      bar.style.gridRow = seg.lane + 2;
      bar.style.background = getColor(seg.ev.title);
      
      const opText = seg.ev.operator ? ` [${seg.ev.operator}]` : '';
      bar.textContent = seg.ev.title + opText;
      
      // 바 클릭 시 상세 정보 모달 열기
      bar.onclick = () => openInfoModal(seg.ev);
      row.appendChild(bar);
    });
    els.calendarBody.appendChild(row);
  });
}

function render(){
  els.monthLabel.textContent = `${state.year}년 ${state.month+1}월`;
  renderWeekdayHeader();
  renderCalendar();
}

/* ================= 모달 팝업 및 데이터 쓰기 ================= */
function openInfoModal(ev) {
  document.getElementById('infoTitle').textContent = ev.title;
  
  const dStart = fmtDateForUI(ev.start);
  const dEnd = fmtDateForUI(ev.end);
  document.getElementById('infoDates').textContent = (dStart === dEnd) ? dStart : `${dStart} ~ ${dEnd}`;
  
  document.getElementById('editOperator').value = ev.operator;
  document.getElementById('editOriginalStart').value = fmtDateForInput(ev.start);
  document.getElementById('editTitleHidden').value = ev.title;
  
  document.getElementById('infoModalOverlay').style.display = 'flex';
}

function closeModal(id) { document.getElementById(id).style.display = 'none'; }

async function submitEditEvent() {
  if(!WEB_APP_URL) return alert('운영자를 저장하려면 앱스 스크립트 웹앱 주소(WEB_APP_URL) 세팅이 필요합니다.\n현재는 읽기 전용 모드입니다.');

  const title = document.getElementById('editTitleHidden').value;
  const operator = document.getElementById('editOperator').value;
  const start = document.getElementById('editOriginalStart').value;
  
  const payload = { action: 'updateOperator', title, start, operator, sheetId: CONFIG.sheetId };
  
  closeModal('infoModalOverlay');
  els.status.textContent = '🔄 시트에 데이터 저장 중...';
  
  try {
    await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload) });
    // 저장 후 즉시 최신 데이터 다시 불러오기
    fetchData(); 
  } catch(e) {
    els.status.textContent = '🔴 업데이트 실패';
  }
}

/* ================= 초기 바인딩 ================= */
document.getElementById('prevBtn').onclick = ()=>{
  state.month--; if(state.month<0){ state.month=11; state.year--; } render();
};
document.getElementById('nextBtn').onclick = ()=>{
  state.month++; if(state.month>11){ state.month=0; state.year++; } render();
};
document.getElementById('todayBtn').onclick = ()=>{
  const t = new Date(); state.year = t.getFullYear(); state.month = t.getMonth(); render();
};

window.onload = fetchData;
</script>
</body>
</html>
