<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>오프라인 교육운영 캘린더(운영진 포함)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #14171C;
    --panel-alt: #1B1E24;
    --panel-alt2: #262B33;
    --text-light: #F5F4EF;
    --text-muted: #B2B5AE;
    --cal-bg: #FBFAF7;
    --cal-text: #2A2D28;
    --cal-line: #E7E3D8;
    --cal-header: #F1EDE3;
    --accent: #3E7A57;
    --danger: #C0664A;
    --font: 'Noto Sans KR', -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  body { margin: 0; padding: 28px; background: var(--bg-dark); color: var(--text-light); font-family: var(--font); line-height: 1.5; -webkit-font-smoothing: antialiased; }

  .layout { display: flex; align-items: flex-start; max-width: 1950px; margin: 0 auto; }
  .dash { flex: 1 1 auto; min-width: 0; }

  .top { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 16px; margin-bottom: 22px; }
  .top h1 { font-size: 32px; font-weight: 800; margin: 0 0 6px; letter-spacing: -0.3px; }
  .top .sub { font-size: 14.5px; color: var(--text-muted); }

  .nav { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .nav button { border: 1px solid #33373E; background: var(--panel-alt); color: var(--text-light); border-radius: 7px; width: 38px; height: 38px; cursor: pointer; font-size: 17px; transition: background .15s; font-family: var(--font); }
  .nav button:hover { background: #262A31; }
  .nav .month-label { font-size: 19px; font-weight: 700; min-width: 108px; text-align: center; }
  .nav .today-btn, .nav .add-btn { width: auto; padding: 0 16px; font-size: 14px; font-weight: 600; }
  .nav .add-btn { background: var(--accent); border-color: var(--accent); color: #fff; }
  .nav .add-btn:hover { background: #366A4C; }

  .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 13.5px; color: var(--text-muted); flex-wrap: wrap; gap: 8px; }
  .status-bar #statusMsg.ok { color: #8FCBA6; }
  .status-bar #statusMsg.err { color: var(--danger); }
  .status-bar button.sync-btn { background: transparent; border: 1px solid #33373E; color: #D6D8D1; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-family: var(--font); }
  .status-bar button.sync-btn:hover { background: var(--panel-alt); }

  .cal { background: var(--cal-bg); border: 1px solid var(--cal-line); border-radius: 12px; overflow: hidden; color: var(--cal-text); box-shadow: 0 10px 28px rgba(0,0,0,.35); }
  .weekday-row { display: grid; grid-template-columns: repeat(7,1fr); background: var(--cal-header); border-bottom: 1px solid var(--cal-line); }
  .weekday-row div { text-align: center; font-size: 14.5px; font-weight: 600; padding: 12px 0; color: #6B6E64; }
  .weekday-row div.sun { color: #B25C4A; }
  .weekday-row div.sat { color: #4A6FA0; }

  .week-row { display: grid; grid-template-columns: repeat(7,1fr); column-gap: 1px; row-gap: 6px; padding: 8px 0 14px; border-top: 1px solid var(--cal-line); min-height: 132px; align-content: start; }
  .week-row:first-child { border-top: none; }

  .date-cell { grid-row: 1; text-align: right; padding: 3px 10px 4px 0; font-size: 14.5px; font-weight: 500; color: #4C4F47; }
  .date-cell.other-month { color: #C6C2B4; }
  .date-cell.today .num { display: inline-block; background: var(--accent); color: #fff; border-radius: 50%; width: 26px; height: 26px; line-height: 26px; text-align: center; font-weight: 700; font-size: 14px; }

  .event-bar {
    grid-row: span 1; margin: 0 5px; padding: 6px 9px; border-radius: 6px;
    font-size: 13.5px; font-weight: 600; color: #2E312B; cursor: pointer;
    border: 1px solid rgba(0,0,0,.07);
    line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .event-bar:hover { filter: brightness(0.97); }

  /* ===== 우측 푸시 패널 (데스크톱: 캘린더를 밀어내며 등장) ===== */
  .drawer { flex: 0 0 auto; width: 0; padding-left: 0; overflow: hidden; transition: width .32s ease, padding-left .32s ease; }
  .drawer.open { width: 480px; padding-left: 20px; }
  .drawer-inner { width: 460px; height: calc(100vh - 56px); background: var(--panel-alt); border: 1px solid #2A2E35; border-radius: 14px; overflow-y: auto; }

  .drawer-head { background: #FFFFFF; color: #17181B; padding: 28px 28px 24px; position: relative; }
  .drawer-close { position: absolute; top: 18px; right: 18px; width: 36px; height: 36px; border: none; background: #F0EFEA; border-radius: 50%; font-size: 17px; cursor: pointer; }
  .drawer-close:hover { background: #E4E2DB; }
  .drawer-badge { display: inline-block; padding: 5px 13px; border-radius: 20px; font-size: 13px; font-weight: 700; margin-bottom: 14px; border: 1px solid rgba(0,0,0,.1); color: #33362F; }
  .drawer-head h2 { margin: 0; font-size: 26px; font-weight: 800; line-height: 1.4; padding-right: 40px; }
  .drawer-head input, .drawer-badge input { font-family: var(--font); border: none; border-bottom: 2px solid var(--accent); background: transparent; outline: none; }
  .drawer-head input#editTitle { font-size: 26px; font-weight: 800; width: 100%; padding: 2px 0; }
  .drawer-badge input#editClient { font-size: 13px; font-weight: 700; width: 110px; }

  .drawer-body { padding: 24px 28px 32px; }
  .edit-toggle-row { display: flex; justify-content: flex-end; margin-bottom: 10px; }
  .edit-toggle-row button { background: transparent; border: 1px solid #3A3F47; color: #D6D8D1; padding: 8px 16px; border-radius: 20px; font-size: 13.5px; cursor: pointer; font-family: var(--font); }
  .edit-toggle-row button:hover { background: var(--panel-alt2); }

  .info-list { display: grid; grid-template-columns: 84px 1fr; row-gap: 18px; column-gap: 16px; font-size: 17px; margin-bottom: 26px; align-items: center; }
  .info-list dt { color: var(--text-muted); font-weight: 500; }
  .info-list dd { margin: 0; font-weight: 700; color: var(--text-light); }
  .info-list dd input, .info-list dd select { width: 100%; font-family: var(--font); font-size: 16px; font-weight: 600; background: var(--panel-alt2); border: 1px solid #3A3F47; color: var(--text-light); border-radius: 6px; padding: 9px 11px; }
  .date-range-edit { display: flex; align-items: center; gap: 8px; }
  .date-range-edit input { flex: 1; }

  .staff-label { font-size: 15px; color: var(--text-muted); margin-bottom: 12px; font-weight: 500; }
  .staff-list { display: flex; flex-wrap: wrap; gap: 9px; }
  .staff-chip { display: inline-flex; align-items: center; background: var(--panel-alt2); border: 1px solid #3A3F47; border-radius: 22px; padding: 10px 18px; font-size: 16px; font-weight: 600; color: var(--text-light); }
  .staff-chip.empty { color: var(--text-muted); font-weight: 500; font-style: italic; }
  .staff-edit-list { display: flex; flex-direction: column; gap: 9px; }
  .staff-edit-list input { font-family: var(--font); font-size: 16px; background: var(--panel-alt2); border: 1px solid #3A3F47; color: var(--text-light); border-radius: 6px; padding: 10px 13px; }

  .drawer-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }
  .drawer-actions button { border: none; padding: 11px 20px; border-radius: 6px; cursor: pointer; font-size: 14.5px; font-weight: 700; font-family: var(--font); }
  .btn-cancel { background: transparent; color: #D6D8D1; border: 1px solid #3A3F47 !important; }
  .btn-save { background: var(--accent); color: #fff; }
  .drawer-save-msg { font-size: 13px; color: var(--text-muted); margin-top: 12px; min-height: 16px; }
  .drawer-save-msg.ok { color: #8FCBA6; }
  .drawer-save-msg.err { color: var(--danger); }

  .drawer-overlay { display: none; }

  /* ===== 모바일: 전체 화면 오버레이로 전환 ===== */
  @media (max-width: 900px) {
    body { padding: 14px; }
    .layout { display: block; }
    .top h1 { font-size: 24px; }
    .event-bar { font-size: 11.5px; padding: 5px 7px; }
    .date-cell, .weekday-row div { font-size: 12.5px; }
    .nav .month-label { min-width: 84px; font-size: 16px; }

    .drawer-overlay { display: block; position: fixed; inset: 0; background: rgba(10,11,13,.6); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 998; }
    .drawer-overlay.open { opacity: 1; pointer-events: auto; }
    .drawer { position: fixed; top: 0; right: 0; height: 100%; width: 100%; padding-left: 0; transform: translateX(100%); transition: transform .3s ease; z-index: 999; overflow: visible; }
    .drawer.open { width: 100%; transform: translateX(0); }
    .drawer-inner { width: 100%; height: 100%; border-radius: 0; border: none; }
  }
</style>
</head>
<body>
<div class="layout" id="layout">
  <div class="dash">
    <div class="top">
      <div>
        <h1>🗓️ 오프라인 교육운영 캘린더(운영진 포함)</h1>
        <div class="sub">구글 시트 연동 · 일정을 클릭하면 상세 정보를 보고 바로 수정할 수 있어요.</div>
      </div>
      <div class="nav">
        <button class="add-btn" id="addBtn">＋ 일정 추가</button>
        <button id="prevBtn" title="이전 달">‹</button>
        <div class="month-label" id="monthLabel"></div>
        <button id="nextBtn" title="다음 달">›</button>
        <button class="today-btn" id="todayBtn">오늘</button>
      </div>
    </div>

    <div class="status-bar">
      <span id="statusMsg">데이터 연동 중...</span>
      <button class="sync-btn" onclick="fetchData()">🔄 데이터 새로고침</button>
    </div>

    <div class="cal">
      <div class="weekday-row" id="weekdayRow"></div>
      <div id="calendarBody"></div>
    </div>
  </div>

  <aside class="drawer" id="drawer">
    <div class="drawer-inner">
      <div class="drawer-head">
        <button class="drawer-close" onclick="closeDrawer()">✕</button>
        <span class="drawer-badge" id="drawerBadge"></span>
        <h2 id="drawerTitle"></h2>
      </div>
      <div class="drawer-body">
        <div class="edit-toggle-row" id="editToggleRow">
          <button id="editToggleBtn" onclick="enterEditMode()">✎ 정보 수정</button>
        </div>
        <dl class="info-list">
          <dt>차수</dt><dd id="dCohort"></dd>
          <dt>일정</dt><dd id="dDates"></dd>
          <dt>기간</dt><dd id="dDuration"></dd>
          <dt>지역</dt><dd id="dRegion"></dd>
          <dt>차량</dt><dd id="dVehicle"></dd>
          <dt>인원</dt><dd id="dHeadcount"></dd>
        </dl>
        <div class="staff-label">운영진</div>
        <div id="staffWrap"></div>
        <div class="drawer-actions" id="drawerActions" style="display:none">
          <button class="btn-cancel" onclick="exitEditMode()">취소</button>
          <button class="btn-save" onclick="saveEvent()">저장</button>
        </div>
        <div class="drawer-save-msg" id="saveMsg"></div>
      </div>
    </div>
  </aside>
</div>
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>

<script>
/* ================= 필수 설정 ================= */
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzr1nSRplw5UdikxzJJBkBo5bJ2M_tV161QqbjCawToybanpBdtKUNGfxNtn2a9nHAV/exec";
const CONFIG = { sheetId: '1SZ2ioWu4E6w5wuBkbhrlMTRtrwSF_y7iLVOALy2wFeU', gid: 0, defaultYear: 2026 };
const COL = { client:0, title:1, cohort:2, monthHint:3, range:4, duration:5, region:6, vehicle:7, headcount:8, staff1:9, staff2:10, staff3:11 };
const PALETTE = ['#D9E8D3','#F3DFC0','#D7E0EC','#EAD7E0','#E9DCCF','#D7E6E1','#E3DCEC','#EEDCD0'];
const WD_KR = ['일','월','화','수','목','금','토'];

const state = { year: CONFIG.defaultYear, month: new Date().getMonth(), events: [], categoryColors: new Map() };
const els = { monthLabel: document.getElementById('monthLabel'), weekdayRow: document.getElementById('weekdayRow'), calendarBody: document.getElementById('calendarBody'), status: document.getElementById('statusMsg') };

const stripTime = d => { const c = new Date(d); c.setHours(0,0,0,0); return c; };
const isSameDay = (a,b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
const fmtDateForUI = d => `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}(${WD_KR[d.getDay()]})`;
const fmtISO = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const buildRangeText = (s,e) => {
  const one = d => `${d.getMonth()+1}. ${d.getDate()}(${WD_KR[d.getDay()]})`;
  return isSameDay(s,e) ? one(s) : `${one(s)} ~ ${one(e)}`;
};

function getColor(key){
  if(!state.categoryColors.has(key)) state.categoryColors.set(key, PALETTE[state.categoryColors.size % PALETTE.length]);
  return state.categoryColors.get(key);
}

/* ================= 날짜 파싱 ================= */
function parseKoreanRange(raw, year){
  if(!raw || raw === '-') return null;
  const cleaned = raw.replace(/\([^)]*\)/g, '').trim();
  const parts = cleaned.split('~').map(s => s.trim()).filter(Boolean);
  if(!parts.length) return null;
  const toDate = p => { const m = p.match(/(\d{1,2})\s*\.\s*(\d{1,2})/); return m ? new Date(year, +m[1]-1, +m[2]) : null; };
  const start = toDate(parts[0]);
  if(!start) return null;
  const end = parts[1] ? (toDate(parts[1]) || start) : start;
  return { start, end: end < start ? start : end };
}

/* ================= 구글 시트 연동 ================= */
const cellText = c => c ? (c.v ?? c.f ?? '').toString().trim() : '';

async function fetchData(){
  els.status.textContent = '데이터 실시간 동기화 중...'; els.status.className = '';
  try{
    const url = `https://docs.google.com/spreadsheets/d/${CONFIG.sheetId}/gviz/tq?tqx=out:json&gid=${CONFIG.gid}`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('network');
    const text = await res.text();
    const json = JSON.parse(text.substring(text.indexOf('(')+1, text.lastIndexOf(')')));
    if(!json.table) throw new Error('no-table');

    const parsed = [];
    (json.table.rows || []).forEach(r=>{
      const c = r.c || [];
      const title = cellText(c[COL.title]);
      if(!title || title === '교육명') return;
      const range = parseKoreanRange(cellText(c[COL.range]), CONFIG.defaultYear);
      if(!range) return;
      const staff = [cellText(c[COL.staff1]), cellText(c[COL.staff2]), cellText(c[COL.staff3])]
        .map(s => (s && s !== '-' && s.length > 1) ? s : '');
      parsed.push({
        client: cellText(c[COL.client]), title, cohort: cellText(c[COL.cohort]),
        duration: cellText(c[COL.duration]), region: cellText(c[COL.region]),
        vehicle: cellText(c[COL.vehicle]), headcount: cellText(c[COL.headcount]),
        staff, start: range.start, end: range.end
      });
    });

    state.events = parsed;
    els.status.textContent = `🟢 시트 연동 완료 (${parsed.length}건)`; els.status.className = 'ok';
    render();
  }catch(err){
    els.status.textContent = '🔴 데이터 불러오기 실패 — 시트 공유 권한 또는 gid 값을 확인해주세요.'; els.status.className = 'err';
  }
}

/* ================= 캘린더 렌더링 ================= */
function renderWeekdayHeader(){
  els.weekdayRow.innerHTML = ['월','화','수','목','금','토','일'].map((lbl,i)=>
    `<div class="${i===5?'sat':i===6?'sun':''}">${lbl}</div>`).join('');
}

function renderCalendar(){
  const first = new Date(state.year, state.month, 1);
  const last = new Date(state.year, state.month+1, 0);
  const gridStart = new Date(first); gridStart.setDate(first.getDate() - (first.getDay()+6)%7);
  const gridEnd = new Date(last); gridEnd.setDate(last.getDate() + (6 - (last.getDay()+6)%7));

  const weeks = []; let cur = new Date(gridStart);
  while(cur <= gridEnd){ const w=[]; for(let i=0;i<7;i++){ w.push(new Date(cur)); cur.setDate(cur.getDate()+1); } weeks.push(w); }

  const today = stripTime(new Date());
  els.calendarBody.innerHTML = '';

  weeks.forEach(week=>{
    const segments = [];
    state.events.forEach(ev=>{
      let startPos=-1, endPos=-1;
      week.forEach((d,pos)=>{ if(d >= ev.start && d <= ev.end){ if(startPos===-1) startPos=pos; endPos=pos; } });
      if(startPos!==-1) segments.push({ ev, startPos, endPos });
    });
    segments.sort((a,b)=> a.startPos - b.startPos || (b.endPos-b.startPos) - (a.endPos-a.startPos));

    const laneEnds = [];
    segments.forEach(seg=>{
      let lane = laneEnds.findIndex(end => end < seg.startPos);
      if(lane === -1){ lane = laneEnds.length; laneEnds.push(seg.endPos); } else laneEnds[lane] = seg.endPos;
      seg.lane = lane;
    });

    const row = document.createElement('div');
    row.className = 'week-row';

    week.forEach((d,pos)=>{
      const cell = document.createElement('div');
      cell.className = 'date-cell' + (d.getMonth()!==state.month ? ' other-month' : '') + (isSameDay(d, today) ? ' today' : '');
      cell.style.gridColumn = pos+1;
      cell.innerHTML = isSameDay(d, today) ? `<span class="num">${d.getDate()}</span>` : d.getDate();
      row.appendChild(cell);
    });

    segments.forEach(seg=>{
      const bar = document.createElement('div');
      bar.className = 'event-bar';
      bar.style.gridColumn = `${seg.startPos+1} / span ${seg.endPos-seg.startPos+1}`;
      bar.style.gridRow = seg.lane + 2;
      bar.style.background = getColor(seg.ev.client || seg.ev.title);
      bar.textContent = `${seg.ev.title}${seg.ev.cohort ? ' · '+seg.ev.cohort : ''}`;
      bar.onclick = () => openDrawer(seg.ev, false);
      row.appendChild(bar);
    });
    els.calendarBody.appendChild(row);
  });
}

function render(){
  els.monthLabel.textContent = `${state.year}년 ${state.month+1}월`;
  renderWeekdayHeader();
  renderCalendar();
}

/* ================= 상세/등록 패널 ================= */
let activeEvent = null;
let originalMatch = null;
let isNewEvent = false;

function blankEvent(){
  return { client:'', title:'', cohort:'', duration:'', region:'', vehicle:'', headcount:'', staff:['','',''], start: new Date(), end: new Date() };
}

function openDrawer(ev, asNew){
  activeEvent = ev;
  isNewEvent = !!asNew;
  originalMatch = asNew ? null : { title: ev.title, cohort: ev.cohort, rangeText: buildRangeText(ev.start, ev.end) };

  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawerOverlay').classList.add('open');
  document.getElementById('editToggleRow').style.display = isNewEvent ? 'none' : 'flex';
  document.getElementById('saveMsg').textContent = '';

  if(isNewEvent) enterEditMode(); else { exitEditMode(); }
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerOverlay').classList.remove('open');
}

function renderViewMode(){
  const ev = activeEvent;
  document.getElementById('drawerBadge').textContent = ev.client || '기타';
  document.getElementById('drawerBadge').style.background = getColor(ev.client || ev.title);
  document.getElementById('drawerTitle').textContent = ev.title;
  document.getElementById('dCohort').textContent = ev.cohort || '-';
  document.getElementById('dDates').textContent = isSameDay(ev.start, ev.end) ? fmtDateForUI(ev.start) : `${fmtDateForUI(ev.start)} ~ ${fmtDateForUI(ev.end)}`;
  document.getElementById('dDuration').textContent = ev.duration || '-';
  document.getElementById('dRegion').textContent = ev.region || '-';
  document.getElementById('dVehicle').textContent = ev.vehicle || '-';
  document.getElementById('dHeadcount').textContent = ev.headcount || '-';

  const wrap = document.getElementById('staffWrap');
  wrap.innerHTML = '<div class="staff-list">' + ev.staff.map(n =>
    n ? `<span class="staff-chip">${n}</span>` : `<span class="staff-chip empty">미배정</span>`
  ).join('') + '</div>';

  document.getElementById('drawerActions').style.display = 'none';
}

function renderEditMode(){
  const ev = activeEvent;
  document.getElementById('drawerBadge').innerHTML = `<input id="editClient" value="${ev.client}" placeholder="고객사" />`;
  document.getElementById('drawerTitle').innerHTML = `<input id="editTitle" value="${ev.title}" placeholder="교육명 입력" />`;
  document.getElementById('dCohort').innerHTML = `<input id="editCohort" value="${ev.cohort}" placeholder="예: 1차수" />`;
  document.getElementById('dDates').innerHTML = `
    <div class="date-range-edit">
      <input type="date" id="editStart" value="${fmtISO(ev.start)}" />
      <span>~</span>
      <input type="date" id="editEnd" value="${fmtISO(ev.end)}" />
    </div>`;
  document.getElementById('dDuration').innerHTML = `<input id="editDuration" value="${ev.duration}" placeholder="예: 2박 3일" />`;
  document.getElementById('dRegion').innerHTML = `<input id="editRegion" value="${ev.region}" placeholder="예: 강릉" />`;
  document.getElementById('dVehicle').innerHTML = `
    <select id="editVehicle">
      <option value="O" ${ev.vehicle==='O'?'selected':''}>O</option>
      <option value="X" ${ev.vehicle!=='O'?'selected':''}>X</option>
    </select>`;
  document.getElementById('dHeadcount').innerHTML = `<input id="editHeadcount" value="${ev.headcount}" placeholder="예: 2~3" />`;

  const wrap = document.getElementById('staffWrap');
  wrap.innerHTML = '<div class="staff-edit-list">' + [0,1,2].map(i =>
    `<input id="editStaff${i}" value="${ev.staff[i]||''}" placeholder="Staff${i+1} 이름" />`
  ).join('') + '</div>';

  document.getElementById('drawerActions').style.display = 'flex';
}

function enterEditMode(){ renderEditMode(); document.getElementById('editToggleRow').style.display = 'none'; }
function exitEditMode(){
  if(isNewEvent){ closeDrawer(); return; }
  renderViewMode();
  document.getElementById('editToggleRow').style.display = 'flex';
}

function collectForm(){
  return {
    client: document.getElementById('editClient').value.trim(),
    title: document.getElementById('editTitle').value.trim(),
    cohort: document.getElementById('editCohort').value.trim(),
    start: new Date(document.getElementById('editStart').value),
    end: new Date(document.getElementById('editEnd').value),
    duration: document.getElementById('editDuration').value.trim(),
    region: document.getElementById('editRegion').value.trim(),
    vehicle: document.getElementById('editVehicle').value,
    headcount: document.getElementById('editHeadcount').value.trim(),
    staff: [0,1,2].map(i => document.getElementById(`editStaff${i}`).value.trim())
  };
}

async function saveEvent(){
  const form = collectForm();
  if(!form.title){ alert('교육명을 입력해주세요.'); return; }
  const msg = document.getElementById('saveMsg');

  if(!WEB_APP_URL){ msg.textContent = '⚠️ 앱스 스크립트 미연동 — 시트에는 저장되지 않아요.'; msg.className = 'drawer-save-msg err'; return; }

  const data = {
    client: form.client, title: form.title, cohort: form.cohort,
    start: fmtISO(form.start), rangeText: buildRangeText(form.start, form.end),
    duration: form.duration, region: form.region, vehicle: form.vehicle, headcount: form.headcount,
    staff1: form.staff[0], staff2: form.staff[1], staff3: form.staff[2]
  };
  const payload = isNewEvent
    ? { action: 'addEvent', sheetId: CONFIG.sheetId, data }
    : { action: 'updateEvent', sheetId: CONFIG.sheetId, match: originalMatch, data };

  msg.textContent = '저장 중...'; msg.className = 'drawer-save-msg';
  try{
    await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload) });
    msg.textContent = '✓ 저장됨 — 캘린더 반영 중...'; msg.className = 'drawer-save-msg ok';
    closeDrawer();
    fetchData();
    setTimeout(fetchData, 1500);
  }catch(e){
    msg.textContent = '🔴 저장 실패 — 앱스 스크립트 확인 필요'; msg.className = 'drawer-save-msg err';
  }
}

/* ================= 초기 바인딩 ================= */
document.getElementById('prevBtn').onclick = ()=>{ state.month--; if(state.month<0){ state.month=11; state.year--; } render(); };
document.getElementById('nextBtn').onclick = ()=>{ state.month++; if(state.month>11){ state.month=0; state.year++; } render(); };
document.getElementById('todayBtn').onclick = ()=>{ const t=new Date(); state.year=t.getFullYear(); state.month=t.getMonth(); render(); };
document.getElementById('addBtn').onclick = ()=> openDrawer(blankEvent(), true);
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeDrawer(); });

window.onload = fetchData;
</script>
